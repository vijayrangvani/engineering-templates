# TEMPLATE: HorizontalPodAutoscaler = add/remove pods based on CPU. Needs metrics-server installed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: items-api
  namespace: items
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: items-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }   # % of the pod's CPU *request*
