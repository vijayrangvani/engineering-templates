# TEMPLATE: Secret = sensitive values. This is an EXAMPLE -> never commit real secrets.
# Easier way to create:  kubectl -n items create secret generic items-secret \
#                          --from-literal=DATABASE_URL='postgresql+psycopg://user:pass@host:5432/db'
apiVersion: v1
kind: Secret
metadata:
  name: items-secret
  namespace: items
type: Opaque
stringData:                 # stringData = plain text; K8s base64-encodes it for you (base64 is NOT encryption)
  DATABASE_URL: "postgresql+psycopg://app:CHANGE_ME@postgres:5432/app"
