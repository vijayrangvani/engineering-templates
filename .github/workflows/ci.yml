# TEMPLATE: GitHub Actions CI with uv. Runs on every push / PR: install (locked) -> lint -> test -> build image.
# Shape: on (trigger) -> jobs -> runs-on -> steps (checkout -> setup -> install -> check -> build)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read                             # CI only reads the repo (least privilege)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                       # one folder failing doesn't cancel the others
      matrix:                                # same steps, run once per folder (in parallel)
        app: [fastapi-app, auth-jwt, llm-testing, llm-streaming, mcp-server, async-jobs, observability, llm, python]
    defaults:
      run:
        working-directory: ${{ matrix.app }} # all `run:` steps execute in this folder
    steps:
      - uses: actions/checkout@v5            # get the repo code

      - uses: astral-sh/setup-uv@v7          # installs uv; Python version comes from .python-version
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.app }}/uv.lock

      - name: Install (exact locked versions)
        run: uv sync --locked                # fails if uv.lock is missing or out of date

      - name: Lint
        run: uv run ruff check --output-format=github .   # fast linter; fails the job on errors
      # No `ruff format --check` here on purpose: the formatter would wrap lines and break the
      # hand-aligned teaching comments. Lint (above) still catches real bugs.

      - name: Test
        if: matrix.app != 'llm' && matrix.app != 'python'   # these two folders are scripts without tests
        shell: bash
        run: |
          # On failure, turn the error lines into GitHub annotations (visible on the run page).
          set +e   # GitHub's bash runs with -e; turn it off so we reach the error-reporting line
          uv run pytest -q --tb=short -rf 2>&1 | tee pytest.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then grep -E '^E |^FAILED' pytest.log | head -8 | sed 's/^/::error::/'; fi
          exit $code

      - name: Migrations match models
        if: matrix.app == 'fastapi-app'      # step runs only for this folder
        env:
          DATABASE_URL: sqlite:///./ci.db
        shell: bash
        run: |
          set -o pipefail
          { uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base; } 2>&1 | tee alembic.log \
            || { tail -12 alembic.log | sed 's/^/::error::/'; exit 1; }

  docker:
    needs: test                              # only build if tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t items-api:${{ github.sha }} fastapi-app   # tag with commit SHA

      - name: Smoke test the container (non-root user can write SQLite, migrations ship in the image)
        shell: bash
        run: |
          # Run migrations, then the app, with SQLite inside the container as the non-root user.
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:///./app.db items-api:${{ github.sha }} \
            sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 20); do curl -fs localhost:8000/ready && exit 0; sleep 1; done
          docker logs api; exit 1

      - name: Build multi-stage Dockerfile
        run: docker build -f docker/Dockerfile.multistage -t items-api-multistage fastapi-app
      # To push to a registry, add a login step (e.g. docker/login-action@v3) with
      # credentials from repo Settings -> Secrets: ${{ secrets.REGISTRY_TOKEN }}

  infra:
    # Syntax/schema checks only: nothing is created and no cloud credentials are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false   # downloads the provider, no state
          terraform validate
      - name: Kubernetes manifests match the API schema
        run: docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /k8s
      - name: Compose files are valid
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f observability/docker-compose.yml config -q
