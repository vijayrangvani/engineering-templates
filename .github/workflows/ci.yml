# TEMPLATE: GitHub Actions CI with uv. Runs on every push / PR: install (locked) -> lint -> test -> build image.
# Shape: on (trigger) -> jobs -> runs-on -> steps (checkout -> setup -> install -> check -> build)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                       # one folder failing doesn't cancel the others
      matrix:                                # same steps, run once per folder (in parallel)
        app: [fastapi-app, auth-jwt, llm-testing, llm-streaming, mcp-server, async-jobs, observability, llm, python]
    defaults:
      run:
        working-directory: ${{ matrix.app }} # all `run:` steps execute in this folder
    steps:
      - uses: actions/checkout@v5            # get the repo code

      - uses: astral-sh/setup-uv@v7          # installs uv; Python version comes from .python-version
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.app }}/uv.lock

      - name: Install (exact locked versions)
        run: uv sync --locked                # fails if uv.lock is missing or out of date

      - name: Lint
        run: uv run ruff check --output-format=github .   # fast linter; fails the job on errors

      - name: Test
        if: matrix.app != 'llm' && matrix.app != 'python'   # these two folders are scripts without tests
        shell: bash
        run: |
          # On failure, turn the error lines into GitHub annotations (visible on the run page).
          set +e   # GitHub's bash runs with -e; turn it off so we reach the error-reporting line
          uv run pytest -q --tb=short -rf 2>&1 | tee pytest.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then grep -E '^E |^FAILED' pytest.log | head -8 | sed 's/^/::error::/'; fi
          exit $code

      - name: Migrations match models
        if: matrix.app == 'fastapi-app'      # step runs only for this folder
        env:
          DATABASE_URL: sqlite:///./ci.db
        shell: bash
        run: |
          set -o pipefail
          { uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base; } 2>&1 | tee alembic.log \
            || { grep -E "Error|error" alembic.log | head -10 | sed 's/^/::error::/'; exit 1; }

  docker:
    needs: test                              # only build if tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t items-api:${{ github.sha }} fastapi-app   # tag with commit SHA
      # To push to a registry, add a login step (e.g. docker/login-action@v3) with
      # credentials from repo Settings -> Secrets: ${{ secrets.REGISTRY_TOKEN }}
