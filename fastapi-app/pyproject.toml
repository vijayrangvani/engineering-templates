# Managed with uv:  uv sync  (creates .venv with the exact versions in uv.lock)
#   add a package:  uv add <pkg>        dev-only:  uv add --dev <pkg>
#   run anything:   uv run pytest  /  uv run uvicorn app.main:app --reload
[project]
name = "fastapi-app-template"
version = "0.1.0"
description = "FastAPI + SQLAlchemy 2.0 + Alembic layered API"
requires-python = ">=3.14"             # keep equal to .python-version
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",  # Postgres driver (only used when DATABASE_URL points to Postgres)
    "alembic>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.17"]

[tool.uv]
package = false                        # an app / script folder, not an installable library

[tool.ruff]
target-version = "py314"
