# TEMPLATE: Alembic config. The DB URL is NOT here: migrations/env.py reads it from app settings (.env).
[alembic]
script_location = migrations
# add the project folder to sys.path so env.py can `import app`
prepend_sys_path = .
# file names like 2026_10_11_1200-<rev>_add_items.py (sortable by date)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
