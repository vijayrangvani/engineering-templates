# Run: docker compose up --build  -> API :8000, Prometheus :9090, Grafana :3000 (admin/admin)
# In Grafana: add data source http://prometheus:9090, then query e.g.
#   rate(http_requests_total[1m])
#   histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))   <- p95 latency
services:
  api:
    build: .
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v3.0.0    # pinned: :latest changes under you
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
